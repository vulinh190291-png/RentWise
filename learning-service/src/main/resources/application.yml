spring:
  application:
    name: training-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rentwise_training_v04?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8082}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

rentwise:
  internal-key: ${INTERNAL_API_KEY}
  profile:
    remote-enabled: ${PROFILE_REMOTE_ENABLED:true}
    base-url: ${PROFILE_SERVICE_URL:http://127.0.0.1:8083}