spring:
  application:
    name: profile-service

  datasource:
    url: ${PROFILE_DB_URL:jdbc:mysql://localhost:3306/rentwise_profile_v04?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${PROFILE_DB_USERNAME:root}
    password: ${PROFILE_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

server:
  address: 127.0.0.1
  port: 8083
